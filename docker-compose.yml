services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: classloom
      POSTGRES_USER: classloom
      POSTGRES_PASSWORD: classloom_dev
    ports:
      - '5433:5432'
    volumes:
      - classloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classloom -d classloom']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  classloom_pgdata:
